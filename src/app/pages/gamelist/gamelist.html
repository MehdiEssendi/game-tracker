<!-- Conteneur de la grille qui va organiser les cartes -->

<div class="games-grid">
  
  @for (game of games(); track game.id) {
    
    <mat-card 
    class="game-card"
    [routerLink]="['/games', game.id]"
    >
    
    <img mat-card-image [src]="game.background_image">
    
    <mat-card-content>
      <h3 class="title">{{ game.name }}</h3>
      <p>⭐ {{ game.rating }}</p>
    </mat-card-content>
    
  </mat-card>
  
}

</div>
